[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simst"
version = "0.3.3"
description = "CCFv3-informed multi-individual 3D spatial transcriptomics simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "torch>=2.0",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10", "h5py>=3.8"]
nrrd = ["pynrrd>=1.0"]
atlas = ["pynrrd>=1.0"]
full = ["anndata>=0.10", "h5py>=3.8", "pynrrd>=1.0", "pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
